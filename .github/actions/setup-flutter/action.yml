name: Setup Flutter
description: Installs the pinned Flutter SDK (and Java for Android builds) and resolves the pub workspace.

inputs:
  flutter-version:
    description: Flutter version used by every job. Bump it here only.
    default: "3.47.5"
  java:
    description: Also install Java 17 (needed to build the Android APK).
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Java
      if: inputs.java == 'true'
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Resolve workspace dependencies
      shell: bash
      run: |
        flutter --version
        flutter pub get

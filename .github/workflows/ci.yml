name: CI

on:
  push:
    branches: ["**"]
    paths-ignore: ["**.md"]
  pull_request:
  # Actions → CI → Run workflow. Tick "release" to publish the APK as a new
  # GitHub Release (v<version>-build<run>); older releases are kept.
  workflow_dispatch:
    inputs:
      release:
        description: Publish the APK as a GitHub Release
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  android:
    needs: checks
    uses: ./.github/workflows/android-build.yml

  web:
    name: Build web preview
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-flutter

      - name: Build
        run: flutter build web --release --no-web-resources-cdn

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: build/web

  release:
    name: Publish GitHub Release
    needs: android
    if: github.event_name == 'workflow_dispatch' && inputs.release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.android.outputs.artifact }}

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.android.outputs.tag }}
          name: SVG Motion Gallery ${{ needs.android.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: ${{ needs.android.outputs.artifact }}.apk

# Manual release: Actions → Release → Run workflow. Runs every check, builds
# the APK and publishes it as a new GitHub Release (old releases are kept).
name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  android:
    needs: checks
    uses: ./.github/workflows/android-build.yml

  publish:
    name: Publish GitHub Release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.android.outputs.artifact }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.android.outputs.tag }}
          name: SVG Motion Gallery ${{ needs.android.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: ${{ needs.android.outputs.artifact }}.apk

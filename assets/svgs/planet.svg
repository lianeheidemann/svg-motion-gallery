<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <radialGradient id="planet" cx="35%" cy="30%"><stop offset="0" stop-color="#9EF5FF"/><stop offset=".35" stop-color="#6E64FF"/><stop offset="1" stop-color="#35107A"/></radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#27DAFF"/><stop offset=".55" stop-color="#A93CFF"/><stop offset="1" stop-color="#FF53B7"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="600" fill="#040D19"/>
  <g transform="translate(400 300)" filter="url(#glow)">
    <g>
      <ellipse rx="255" ry="72" fill="none" stroke="url(#ring)" stroke-width="26" transform="rotate(-14)"/>
      <ellipse rx="220" ry="48" fill="none" stroke="#7B4DFF" stroke-width="5" opacity=".55" transform="rotate(-14)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </g>
    <circle r="128" fill="url(#planet)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="-44" cy="-42" r="17" fill="#90E9FF" opacity=".35"/>
    <circle cx="55" cy="38" r="24" fill="#FF5ED0" opacity=".18"/>
  </g>
  <g fill="#44D8FF"><circle cx="160" cy="150" r="4"/><circle cx="670" cy="190" r="6"/><circle cx="620" cy="440" r="4"/></g>
</svg>
